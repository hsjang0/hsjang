    <linearGradient id="bondTop" x1="872" y1="72" x2="1010" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#19C7D9"/><stop offset="1" stop-color="#4FE27B"/></linearGradient>
    <linearGradient id="bondLeft" x1="872" y1="72" x2="956" y2="132" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#19C7D9"/><stop offset="1" stop-color="#22C5D5"/></linearGradient>
    <linearGradient id="bondRight" x1="1010" y1="42" x2="956" y2="132" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FE27B"/><stop offset="1" stop-color="#24C6D4"/></linearGradient>
  </defs>
  <g stroke-width="16" stroke-linecap="round">
    <line x1="872" y1="72" x2="1010" y2="42" stroke="url(#bondTop)"/>
    <line x1="872" y1="72" x2="956" y2="132" stroke="url(#bondLeft)"/>
