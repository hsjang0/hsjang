# Publication list rendered on the home page.
#
# Fields
#   title            : paper title (the [P#]/[C#]/[J#] tag is added automatically from `tag`)
#   tag              : short reference key used in the bio text, e.g. P3, C4, J1;
#                      omit it to list a paper without a reference number
#   authors          : HTML allowed; wrap your own name in <span class='me'>...</span>
#   venue            : optional long-form venue line under the authors. Left unset
#                      everywhere now, since the badge already names the venue
#   venue_short      : compact label shown in the venue badge
#   year             : publication year (shown in the badge); omit it for work in
#                      progress so the badge reads just the venue_short label
#   highlight        : optional emphasis inside the badge, e.g. "Oral, 1.16%"
#   extra_badges     : optional list of {label, kind}; kind "workshop" or "conference"
#                      colours it, e.g. a preliminary workshop version
#   note             : optional small line under the authors, for things that
#                      apply to one paper only
#   team             : optional {before, name, count, after, groups[{role, members}],
#                      legend}; replaces the author line with a sentence whose
#                      team name opens the member list in a popup
#   image            : thumbnail path
#   links            : list of {label, url}; internal paths are prefixed with baseurl
#   selected         : "y" to show on the home page
