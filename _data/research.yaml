# Drug design pipeline shown in the Research section of the home page.
#
# status   : sota     darkest tile, with a SOTA flag
#            active   mid tint
#            explore  light tint
#            planned  grey, no work yet
# name     : `|` marks the line break, so every label sits on two lines
# color    : the stage's hue, kept at the muted saturation of the site's
#            badge colours so the two read as one palette (ignored for planned stages)
# papers   : chips under the tile; `tag` links to that paper's entry in
#            Publications. Leave `tag` out for work that is not public yet.
#            List the most recent work first.
