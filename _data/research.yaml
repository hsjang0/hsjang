# Drug design pipeline shown in the Research section of the home page.
#
# status   : sota     Active label, with a paper-level SOTA badge
#            active   Active label
#            explore  Exploring label
#            planned  Planned label, no work yet
# name     : `|` marks the line break, so every label sits on two lines
# sota_paper: for a sota stage, the tag of the paper that holds it; the
#            SOTA badge links there
# sota_figure, sota_caption: optional; when set, the badge opens the figure in
#            a popup (with a link to the paper) instead of jumping to it
# image    : illustration for each stage
# theme    : optional card palette, e.g. teal
# papers   : entries inside the card; `tag` links to that paper's entry in
#            Publications. Leave `tag` out for work that is not public yet.
#            List the most recent work first. The venue line (e.g. NeurIPS
#            2026) and an Oral mark are read from Publications; set `venue`
#            here to use a shorter label than the publication badge.
updated: "Oct 9, 2026"
stages:
  - name: "Target|Discovery"
    image: "/assets/research/stages/target-v2.png"
    status: explore
    papers:
      - { tag: "C4", label: "Confident reasoning" }
      - { tag: "C1", label: "Diffusion for PPI graphs" }

  - name: "Structure|Prediction"
    image: "/assets/research/stages/structure-v3.png"
    status: sota
    sota_paper: "P2"
    sota_figure: "/assets/research/soupfold_results.png"
    sota_caption: "Structure prediction success rates. SoupFold improves every base co-folding model on FoldBench and leads on GPCR and molecular glue complexes."
    papers:
      - { tag: "P3", label: "K-Fold", venue: "Preprint&nbsp;2026" }
      - { tag: "P2", label: "Soup of representations", venue: "NeurIPS&nbsp;2026<br>AI4DD Workshop" }
      - { tag: "C6", label: "Pre-training representations" }

  - name: "Binding|Affinity"
    image: "/assets/research/stages/affinity-v2.png"
    status: planned

  - name: "Design &|Optimization"
    image: "/assets/research/stages/design-v2.png"
    status: active
    papers:
      - { tag: "P1", label: "Diversified generation", venue: "Preprint&nbsp;2025" }
      - { tag: "C3", label: "Pessimistic discovery" }
      - { tag: "C2", label: "Credit assignments" }
      - { tag: "J2", label: "Latent space exploration", venue: "JCAMD&nbsp;2024" }

  - name: "ADME &|Toxicity"
